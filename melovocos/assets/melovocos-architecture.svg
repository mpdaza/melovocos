<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
<title id="title">MeloTTS and MeloVOCOS: synthesis pathways</title>
<desc id="desc">Conceptual comparison. MeloTTS jointly trains HiFi-GAN with the acoustic model. MeloVOCOS adapts the acoustic representation to log-mel features and uses frozen pretrained VOCOS.</desc>
